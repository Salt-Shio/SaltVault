upstream backend_server {
    server salt-vault-server:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    
    # 關閉上傳檔案大小限制 (預設只有 1MB)
    client_max_body_size 0;

    # 1. 提供 Vue 編譯後的靜態網頁檔案
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # 支援 Vue Router 的 History 模式
        try_files $uri $uri/ /index.html;
    }

    # 2a. 檔案下載單獨拉出一條路徑，關閉緩衝讓資料邊收邊吐
    #     (預設 proxy_buffering on 會讓 nginx 把後端吐出的整包檔案先收進緩衝區，
    #     收完才斷開跟後端的連線，導致後端連線壽命跟瀏覽器實際下載時間脫鉤，
    #     下載憑證的 Heartbeat 續命機制因此失去意義)
    location /api/vfs/download/ {
        proxy_pass http://backend_server/api/vfs/download/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # 2b. 其餘 API 請求轉交給 Python 後端容器 (維持預設緩衝，效能較好)
    location /api/ {
        proxy_pass http://backend_server/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
